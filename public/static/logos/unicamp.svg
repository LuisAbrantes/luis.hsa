<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Unicamp Crimson Globe Seal -->
  <circle cx="100" cy="95" r="75" fill="#C4161C"/>
  
  <!-- Geometric White Radial Arcs & Meridian Rings -->
  <circle cx="100" cy="95" r="62" stroke="#FFFFFF" stroke-width="4.5" fill="none"/>
  <circle cx="100" cy="95" r="46" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <circle cx="100" cy="95" r="28" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <circle cx="100" cy="95" r="10" fill="#FFFFFF"/>
  
  <ellipse cx="100" cy="95" rx="72" ry="32" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <ellipse cx="100" cy="95" rx="32" ry="72" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <line x1="25" y1="95" x2="175" y2="95" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="100" y1="20" x2="100" y2="170" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- UNICAMP text wordmark -->
  <text x="100" y="220" text-anchor="middle" fill="#EDEDED" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="2">UNICAMP</text>
</svg>