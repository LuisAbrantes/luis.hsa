<!DOCTYPE html>
<html lang="en">
    <head>
        <meta
            name="google-site-verification"
            content="furAXzVGbN5A1g2j7wuPoFQl0RzlU52ThruNTTc65Kg"
        />
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luis Henrique Abrantes | Software Engineer & AI Developer</title>
        <meta name="description" content="Portfolio of Luis Henrique Abrantes. Software Engineer and Applied AI Developer." />
        <meta name="robots" content="noindex, follow" />
        <script type="text/javascript">
            // Single Page Apps for GitHub Pages & Custom Domain redirect
            var isCustomDomain = window.location.hostname === 'luisabrantes.dev' || window.location.hostname === 'www.luisabrantes.dev';
            var pathSegmentsToKeep = isCustomDomain ? 0 : 1;

            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join('/') +
                    '/?/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(pathSegmentsToKeep)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search
                        ? '&' + l.search.slice(1).replace(/&/g, '~and~')
                        : '') +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
